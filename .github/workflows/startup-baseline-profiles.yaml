name: ⚡ Startup & Baseline Profiles

on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * MON

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-baseline-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup-bot
        uses: SimonMarquis/setup-github-app-as-bot@v1
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.setup-bot.outputs.token }}
          lfs: true
          persist-credentials: true
      - uses: $/.github/actions/setup-java
      - uses: $/.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: $/.github/actions/setup-gradle-properties

      - name: 🎛️ Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🤖 Generate Profiles
        run: ./gradlew generateBaselineProfile

      - name: 📦 Archive Profiles
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profiles
          path: "**/generated/baselineProfiles/*-prof.txt"
          if-no-files-found: error

      - name: 📡 Create PR
        run: |
          git add -- '**/generated/baselineProfiles/*-prof.txt'

          if git diff --cached --quiet --exit-code -- '**/generated/baselineProfiles/*-prof.txt'; then
            echo "::notice::UP-TO-DATE"; exit 0
          fi

          git commit -m "⚡ Startup & Baseline Profiles" -- '**/generated/baselineProfiles/*-prof.txt'

          # Shared bot branch: force it to this run's commit so the PR tracks the latest profiles
          branch="update-android-profiles"
          git push --force origin "HEAD:$branch"
          gh pr view --head "$branch" >/dev/null 2>&1 \
            || gh pr create --title "⚡ Startup & Baseline Profiles" --fill \
              --base "$GITHUB_REF_NAME" --head "$branch" \
              --assignee "$GITHUB_TRIGGERING_ACTOR"
        env:
          GH_TOKEN: ${{ steps.setup-bot.outputs.token }}
