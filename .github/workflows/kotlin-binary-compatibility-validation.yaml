name: 📋 Kotlin Binary Compatibility Validation
run-name: 📋 Kotlin Binary Compatibility Validation [${{ inputs.ref }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: PR number, branch, or url
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  kotlin-binary-compatibility-validation:
    if: contains(fromJson(vars.AUTHORIZED_ACTORS || '[]'), github.actor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: setup-bot
        uses: ./.github/actions/setup-bot
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.setup-bot.outputs.token }}
      - if: inputs.ref != ''
        run: gh pr checkout "$INPUT_REF"
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ steps.setup-bot.outputs.token }}

      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: ./.github/actions/setup-gradle-properties

      - run: ./gradlew updateKotlinAbi > /dev/null
      - run: |
          if ! git diff --quiet --exit-code -- ':(glob)**/api/*.api';
          then
            git add -- '**/api/*.api'
            git commit -m "🤖 Update Kotlin Binary Compatibility Validation dumps" -- ':(glob)**/api/*.api'
            git show --oneline --stat

            if [[ -z "${INPUT_REF}" ]]; then
              new_pr_branch="kotlin-binary-compatibility-validation/$GITHUB_RUN_ID-$GITHUB_RUN_NUMBER"
              git switch --create "$new_pr_branch"
              git push origin "$new_pr_branch"
              gh pr create \
                --title "🤖 Update Kotlin Binary Compatibility Validation dumps" --fill \
                --base "$GITHUB_REF_NAME" --head "$new_pr_branch" \
                --assignee "$GITHUB_TRIGGERING_ACTOR"
            else
              git push
            fi
            echo "::notice::UPDATED"
          else
            echo "::notice::UP-TO-DATE"
          fi
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ steps.setup-bot.outputs.token }}
